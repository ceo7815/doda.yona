services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://dodayona.hub.co.il}
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://dodayona.hub.co.il}
      - WHATSAPP_PROVIDER=${WHATSAPP_PROVIDER:-demo}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-demo}
      - POS_PROVIDER=${POS_PROVIDER:-demo}
    restart: unless-stopped
